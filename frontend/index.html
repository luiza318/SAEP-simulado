<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMove</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="colunas">
        <div class="colunaA">
            <div class="logo">
                <img class="logo" src="/anexos/logo_ecomove/icone-test.jpg" alt="">
            </div>
            <h1 class="titulo" >EcoMove</h1>
            <div class="informacoes">
                <h1>5</h1>
                <h1>1.45</h1>
                <h2>Qtd.Atividades</h2>
                <h2>Qtd.CO2 (kg)</h2>
            </div>
            <div class="linha"></div>
            <h1>Atividades</h1>
            <div class="linha2"></div>
            <footer>
                <h1>EcoMove</h1>
                <div class="icons">
                    <div class="tiktok">
                        <img src="/anexos/icones/tiktok.svg" alt="">
                        <h2>TikTok</h2>
                    </div>
                    <div class="insta">
                        <img src="/anexos/icones/instagram.svg" alt="">
                        <h2>Instagram</h2>
                    </div>
                    <div class="twitter">
                        <img src="/anexos/icones/twitter.svg" alt="">
                        <h2>Twitter</h2>
                    </div>
                </div>
                <h3>&copy;Copyright-2024</h3>
            </footer>
        </div>

        <div class="colunaB">
            <header>
                <button type="button">Login</button>
            </header>
            <section class="ativ">
                <h1>Bicicleta</h1>
                <h1>Caminhada</h1>
                <h1>Transporte Público</h1>
            </section>
            <div class="atividade">
                <h1>nome-atividade</h1>
                <section class="s-user">
                    <img class="img-user" src="/anexos/imagens_perfil/usuario01.jpg" alt="">
                    <h2>nome-usuario</h2>
                    <div class="info">
                        <h3>2 km</h3>
                        <h3>20 mim</h3>
                        <h3>0.30 kg</h3>
                        <h2>Distância</h2>
                        <h2>Duração</h2>
                        <h2>CO2 evitado</h2>
                    </div>
                    <div class="interativo">
                        <img src="/anexos/icones/coracao.svg" alt="">
                        <h1>0</h1>
                        <img src="/anexos/icones/comentario.svg" alt="">
                        <h1>0</h1>
                    </div>
                    <p>27/04/2026 - 12:08</p>
                </section>
            </div>
        </div>
        <button type="button" placeholder="Anterior"></button>
        <button type="button" placeholder="1"></button>        
        <button type="button" placeholder="2"></button>
        <button type="button" placeholder="Próximo"></button>
    </div>

    <section class="login">
        <h1>Login</h1>
        <img src="/anexos/icones/x.svg" alt="">
        <input type="email" name="email" id="email" placeholder="Email:">
        <input type="password" name="password" id="password" placeholder="password">
        <button type="button" placeholder="Login"></button>
        <button type="button" placeholder="Cancelar"></button>
    </section>

    <script src="script.js"></script>
</body>
</html>
